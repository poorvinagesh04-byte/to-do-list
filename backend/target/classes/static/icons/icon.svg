<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#gradient)"/>
  <g filter="url(#shadow)">
    <!-- Clipboard body -->
    <rect x="116" y="110" width="280" height="320" rx="36" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Clip Top -->
    <rect x="186" y="82" width="140" height="56" rx="20" fill="#312e81"/>
    <!-- Checkmarks & Task Lines -->
    <!-- Task 1 Checkmark -->
    <circle cx="170" cy="200" r="18" fill="#10b981"/>
    <path d="M162 200 L168 206 L178 194" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="206" y="193" width="140" height="14" rx="7" fill="#94a3b8"/>
    
    <!-- Task 2 Checkmark -->
    <circle cx="170" cy="270" r="18" fill="#10b981"/>
    <path d="M162 270 L168 276 L178 264" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="206" y="263" width="120" height="14" rx="7" fill="#94a3b8"/>
    
    <!-- Task 3 Pending -->
    <circle cx="170" cy="340" r="18" fill="none" stroke="#6366f1" stroke-width="4"/>
    <rect x="206" y="333" width="150" height="14" rx="7" fill="#334155"/>
  </g>
</svg>

