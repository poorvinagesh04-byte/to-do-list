server.port=8080
spring.application.name=secure-todo-app

# Default Profile: File-backed persistent H2 in MySQL compatibility mode
# Zero-config execution: no external database installation needed for immediate testing!
spring.datasource.url=jdbc:h2:file:./data/tododb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2 Console (available at /h2-console for inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Security Settings
app.jwt.secret=4c6f376481a59c38f4208a1c97a892b1572bc13d5e219463b7f80459a96e19c0
app.jwt.expiration-ms=86400000

# Rate Limiter
app.security.rate-limit.login-per-minute=10
app.security.rate-limit.register-per-minute=5

# Scheduling & Reminders
app.scheduler.reminder-check-interval-ms=30000

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Multipart / Import-Export
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
